plugins {
    id 'java'
    id 'application'
}

group = 'io.modporter'
version = '0.1.0'

// 用 source/targetCompatibility 而不是 toolchain：
// 这样任意 JDK 17 及以上都能直接构建，不强制本机必须装 JDK 17 这一个版本。
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// 必须显式指定源码编码为 UTF-8：
// 源文件含中文字符串（报告文字、TODO 说明），而 javac 默认用平台编码，
// 在中文 Windows 上是 GBK，会把 UTF-8 源码读成乱码且不报错——生成的报告全是乱码。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'com.github.javaparser:javaparser-core:3.25.8'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'info.picocli:picocli:4.7.5'
}

application {
    mainClass = 'io.modporter.cli.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'io.modporter.cli.Main'
    }
    // 打包为 fat jar：把 JavaParser / Gson / picocli 一并装入，
    // 前端只需 `java -jar modporter.jar` 即可运行，无需额外的 classpath。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}
