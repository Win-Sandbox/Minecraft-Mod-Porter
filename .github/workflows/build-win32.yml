name: Build Win32 frontend

# 手动触发专用：不在 push / PR / schedule 上自动运行。
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  win32:
    name: Win32 frontend (MSVC x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Win32 frontend
        run: |
          cmake -S frontend/ModPorter.Win32 -B build/win32 -A x64
      - name: Build Win32 frontend (Release)
        run: |
          cmake --build build/win32 --config Release --parallel

      - name: Verify ModPorter.exe exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/win32 -Recurse -Filter ModPorter.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "ModPorter.exe not found"; exit 1 }
          Write-Host "Built: $($exe.FullName)"
          $exe | Select-Object FullName, Length

      - name: Upload Win32 frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: modporter-win32-frontend
          path: build/win32/**/ModPorter.exe
          if-no-files-found: error
          retention-days: 14
