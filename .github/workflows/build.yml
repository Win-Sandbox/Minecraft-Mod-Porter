name: Build

# Building is opt-in; a push or pull request never starts this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend fat JAR (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # No Gradle wrapper is checked into this repository.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build fat JAR
        run: gradle --no-daemon jar
      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: modporter-backend-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  win32:
    name: Win32 frontend (MSVC x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S frontend/ModPorter.Win32 -B build/win32 -A x64
      - name: Build Release
        run: cmake --build build/win32 --config Release --parallel
      - name: Upload Win32 executable
        uses: actions/upload-artifact@v4
        with:
          name: modporter-win32-x64
          path: build/win32/Release/ModPorter.exe
          if-no-files-found: error
          retention-days: 14
