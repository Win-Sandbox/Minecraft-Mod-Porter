name: Build WinUI frontend

# 手动触发专用：不在 push / PR / schedule 上自动运行。
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  winui:
    name: WinUI frontend (.NET 8)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and publish WinUI (win-x64, unpackaged)
        shell: pwsh
        run: |
          dotnet publish frontend/ModPorter.WinUI/ModPorter.WinUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            /p:Platform=x64 `
            /p:PublishDir="$env:GITHUB_WORKSPACE/build/winui/"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'

      - name: Upload WinUI frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: modporter-winui-frontend
          path: build/winui/
          if-no-files-found: error
          retention-days: 14
